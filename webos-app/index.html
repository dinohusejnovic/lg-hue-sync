<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hue &amp; Nanoleaf Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #07090e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .icon-container {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }
    .icon-container svg {
      width: 48px;
      height: 48px;
      fill: #ffffff;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      font-size: 16px;
      color: #94a3b8;
      max-width: 400px;
      line-height: 1.5;
    }
    .status-msg {
      margin-top: 16px;
      font-size: 14px;
      color: #6366f1;
      font-weight: 500;
    }
    .error-box {
      display: none;
      margin-top: 24px;
      padding: 16px 20px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      color: #fca5a5;
      font-size: 14px;
      max-width: 450px;
    }
    button {
      margin-top: 16px;
      padding: 12px 24px;
      background: #6366f1;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus {
      outline: 3px solid #ffffff;
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <svg viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
    </svg>
  </div>
  <div class="spinner" id="spinner"></div>
  <h1>Hue &amp; Nanoleaf Sync</h1>
  <p id="lead">Starting the lighting service&hellip;</p>
  <div class="status-msg" id="status">Starting&hellip;</div>

  <div class="error-box" id="errorBox">
    <span id="errorText">The lighting service is not answering.</span>
    <br>
    <button id="retryBtn">Try again</button>
  </div>

  <script>
    /*
     * The app as the Homebrew Channel installs it carries the lighting service
     * (payload/). Each launch asks the Homebrew Channel, which runs as root, to
     * install or update it from there and make sure it runs, then opens the
     * dashboard. A launcher installed without the service (scripts/deploy.sh)
     * skips that step. ES5 only: the Homebrew Channel's compatibility check
     * reads ES2015 syntax as needing a newer webOS.
     */
    (function () {
      var DASHBOARD = "http://127.0.0.1:8088/?tv=1";
      var STATUS = "http://127.0.0.1:8088/api/status";
      var EXEC = "luna://org.webosbrew.hbchannel.service/exec";
      var appDir = decodeURIComponent(location.pathname.replace(/\/[^\/]*$/, ""));
      var busy = false;

      function el(id) { return document.getElementById(id); }
      function say(text) { el("status").textContent = text; }
      function stuck(text) {
        busy = false;
        el("spinner").style.display = "none";
        el("status").style.display = "none";
        el("errorText").textContent = text;
        el("errorBox").style.display = "block";
        el("retryBtn").focus();
      }

      // Runs payload/install.sh as root. cb(result): the script's JSON line,
      // null when this app carries no service or there is no Homebrew Channel.
      function setup(cb) {
        var bridge;
        try { bridge = new PalmServiceBridge(); } catch (e) { bridge = null; }
        if (!bridge) return cb(null);
        var finished = false;
        var timer = setTimeout(function () {
          if (!finished) { finished = true; cb({ ok: false, error: "setup did not finish" }); }
        }, 120000);
        bridge.onservicecallback = function (msg) {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          var reply = {}, result = null;
          try { reply = JSON.parse(msg); } catch (e) { reply = {}; }
          var lines = String(reply.stdoutString || "").replace(/\s+$/, "").split("\n");
          try { result = JSON.parse(lines[lines.length - 1]); } catch (e) { result = null; }
          cb(result && typeof result.ok === "boolean" ? result : null);
        };
        bridge.call(EXEC, JSON.stringify({ command: 'sh "' + appDir + '/payload/install.sh"' }));
      }

      // Waits for the service to answer, for up to `tries` seconds.
      function waitForService(tries, cb) {
        var xhr = new XMLHttpRequest(), done = false;
        function end(ok) {
          if (done) return;
          done = true;
          if (ok) return cb(true);
          if (tries <= 1) return cb(false);
          setTimeout(function () { waitForService(tries - 1, cb); }, 1000);
        }
        try {
          xhr.open("GET", STATUS + "?t=" + Date.now(), true);
          xhr.timeout = 1500;
          xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) end(xhr.status >= 200 && xhr.status < 300);
          };
          xhr.onerror = function () { end(false); };
          xhr.ontimeout = function () { end(false); };
          xhr.send();
        } catch (e) { end(false); }
      }

      function start() {
        if (busy) return;
        busy = true;
        el("errorBox").style.display = "none";
        el("spinner").style.display = "block";
        el("status").style.display = "block";
        say("Checking the lighting service…");
        setup(function (result) {
          if (result && !result.ok) {
            return stuck("Setup failed: " + (result.error || "unknown error") +
              ". Check that the Homebrew Channel is installed and the TV is rooted.");
          }
          if (result && (result.action === "installed" || result.action === "upgraded")) {
            say("Starting version " + result.version + "…");
          } else {
            say("Connecting…");
          }
          // A fresh start right after the TV boots waits for Home to load.
          waitForService(150, function (ok) {
            if (!ok) return stuck("The lighting service did not start.");
            say("Opening the dashboard…");
            location.replace(DASHBOARD);
          });
        });
      }

      el("retryBtn").addEventListener("click", function () { start(); });
      document.addEventListener("keydown", function (e) {
        var key = e.keyCode || e.which;
        if (key === 13 && el("errorBox").style.display === "block") start();
        else if (key === 461) window.close(); // Back
      });
      start();
    })();
  </script>
</body>
</html>
